<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hors ligne — KA Farm</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b1f14;
        color: #e6f2ea;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
      }
      .emoji {
        font-size: 56px;
        line-height: 1;
      }
      h1 {
        font-size: 1.5rem;
        margin: 16px 0 8px;
      }
      p {
        margin: 0 0 8px;
        color: #a7c9b6;
        line-height: 1.5;
      }
      button {
        margin-top: 20px;
        padding: 12px 20px;
        border: 0;
        border-radius: 10px;
        background: #22c55e;
        color: #052e16;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="emoji" aria-hidden="true">📡</div>
      <h1>Vous êtes hors ligne</h1>
      <p>
        KA Farm fonctionne sans connexion : vos saisies effectuées sur cette page sont conservées
        localement et se synchroniseront dès le retour du réseau.
      </p>
      <p>Vérifiez votre connexion puis réessayez.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
